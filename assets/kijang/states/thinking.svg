<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 480 520" role="img" aria-labelledby="mascot-title mascot-desc"
  data-state="thinking" focusable="false">
  <title id="mascot-title">Kijang, asisten virtual SPMB</title>
  <desc id="mascot-desc">Maskot kijang cokelat memakai headset biru dan syal kuning dengan emblem S.</desc>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDA06B"/>
      <stop offset="1" stop-color="#A96842"/>
    </linearGradient>
    <linearGradient id="furLight" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#E5AD79"/>
      <stop offset="1" stop-color="#C78353"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2455A2"/>
      <stop offset="1" stop-color="#102F68"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE879"/>
      <stop offset="1" stop-color="#E8BC31"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3D9"/>
      <stop offset="1" stop-color="#F0DDB9"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .mascot-float { transform-box: fill-box; transform-origin: center; animation: mascot-bob 4s ease-in-out infinite; }
      .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
      .wave-arm { transform-box: view-box; transform-origin: 352px 385px; }
      .mouth-open, .thinking-bubble, .listen-rings, .success-mark, .success-sparkles { opacity: 0; }
      .mouth-smile { opacity: 1; }
      .pupils { transition: transform .25s ease; }
      .listen-rings circle { fill: none; stroke: #F6D75D; stroke-width: 4; transform-box: fill-box; transform-origin: center; }
      .thinking-dots circle { animation: dot-bounce 1.05s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .thinking-dots circle:nth-child(2) { animation-delay: .14s; }
      .thinking-dots circle:nth-child(3) { animation-delay: .28s; }
      .success-sparkles path { transform-box: fill-box; transform-origin: center; animation: sparkle 1.4s ease-in-out infinite; }
      [data-state="speaking"] .mouth-smile { opacity: 0; }
      [data-state="speaking"] .mouth-open { opacity: 1; animation: talk-mouth .34s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      [data-state="speaking"] .mascot-float { animation-duration: 1.4s; }
      [data-state="listening"] .listen-rings { opacity: 1; }
      [data-state="listening"] .listen-rings circle { animation: listen-pulse 1.7s ease-out infinite; }
      [data-state="listening"] .listen-rings circle:nth-child(2) { animation-delay: .55s; }
      [data-state="listening"] .pupils { transform: translateY(2px) scale(1.06); }
      [data-state="thinking"] .thinking-bubble { opacity: 1; }
      [data-state="thinking"] .pupils { transform: translate(-3px,-5px); }
      [data-state="thinking"] .mascot-float { animation-duration: 3s; }
      [data-state="greeting"] .wave-arm { animation: wave 1.1s ease-in-out infinite; }
      [data-state="success"] .success-mark, [data-state="success"] .success-sparkles { opacity: 1; }
      [data-state="success"] .success-mark { animation: pop-in .42s cubic-bezier(.2,1.5,.4,1) both; transform-box: fill-box; transform-origin: center; }
      [data-state="success"] .success-sparkles path { animation-duration: .9s; }
      [data-state="success"] .mouth-smile { stroke-width: 5.5; }
      @keyframes mascot-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes blink { 0%, 43%, 46%, 82%, 85%, 100% { transform: scaleY(1); } 44.5%, 83.5% { transform: scaleY(.08); } }
      @keyframes talk-mouth { from { transform: scaleY(.45) scaleX(.88); } to { transform: scaleY(1.12) scaleX(1.04); } }
      @keyframes wave { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-11deg); } 55% { transform: rotate(7deg); } 78% { transform: rotate(-8deg); } }
      @keyframes listen-pulse { 0% { transform: scale(.72); opacity: .9; } 100% { transform: scale(1.55); opacity: 0; } }
      @keyframes dot-bounce { 0%,60%,100% { transform: translateY(0); opacity: .6; } 30% { transform: translateY(-5px); opacity: 1; } }
      @keyframes pop-in { from { transform: scale(.2) rotate(-18deg); } to { transform: scale(1) rotate(0); } }
      @keyframes sparkle { 0%,100% { transform: scale(.75) rotate(0); opacity: .55; } 50% { transform: scale(1.12) rotate(12deg); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }
    </style>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="240" cy="497" rx="119" ry="12" fill="#132B52" opacity=".13" filter="url(#softShadow)"/>

  <g class="mascot-float">
    <!-- Antlers -->
    <g fill="none" stroke="#81502F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M190 160 C185 132 181 107 176 78 M181 119 L151 99 M181 119 L183 88"/>
      <path d="M290 160 C295 132 299 107 304 78 M299 119 L329 99 M299 119 L297 88"/>
    </g>
    <g fill="none" stroke="#A66B40" stroke-width="4" stroke-linecap="round" opacity=".65">
      <path d="M186 151 L175 83 M296 151 L305 83"/>
    </g>

    <!-- Ears -->
    <g>
      <path d="M139 192 C105 159 57 153 35 181 C14 207 45 228 83 222 C111 218 132 207 145 199Z" fill="url(#fur)" stroke="#75492F" stroke-width="5"/>
      <path d="M341 192 C375 159 423 153 445 181 C466 207 435 228 397 222 C369 218 348 207 335 199Z" fill="url(#fur)" stroke="#75492F" stroke-width="5"/>
      <path d="M121 190 C94 173 57 177 44 194 C36 205 54 211 80 207 C99 204 114 198 121 190Z" fill="#F2B6A0"/>
      <path d="M359 190 C386 173 423 177 436 194 C444 205 426 211 400 207 C381 204 366 198 359 190Z" fill="#F2B6A0"/>
      <path d="M116 190 Q83 181 54 198 M364 190 Q397 181 426 198" fill="none" stroke="#FFE0C4" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    </g>

    <!-- Headset arch behind head -->
    <path d="M127 255 C120 112 360 112 353 255" fill="none" stroke="#102D62" stroke-width="25" stroke-linecap="round"/>
    <path d="M132 246 C130 132 350 132 348 246" fill="none" stroke="#2A5BA7" stroke-width="8" stroke-linecap="round" opacity=".9"/>

    <!-- Body -->
    <path d="M132 383 C145 356 179 344 240 344 C301 344 335 356 348 383 C365 419 369 464 365 520 H115 C111 464 115 419 132 383Z"
      fill="url(#fur)" stroke="#75492F" stroke-width="5" stroke-linejoin="round"/>
    <path d="M145 410 C158 389 185 379 208 379" fill="none" stroke="#E9B27F" stroke-width="5" stroke-linecap="round" opacity=".48"/>
    <g fill="#F5DDBA" opacity=".95">
      <circle cx="163" cy="452" r="9"/><circle cx="197" cy="484" r="7"/><circle cx="315" cy="454" r="9"/><circle cx="284" cy="489" r="7"/>
    </g>
    <g fill="#F7E5C9" opacity=".65">
      <circle cx="163" cy="450" r="3"/><circle cx="315" cy="452" r="3"/>
    </g>

    <!-- Raised arm and hoof -->
    <g transform="translate(18 0)">
    <g class="wave-arm">
      <path d="M321 390 C350 382 380 355 394 322 C403 301 405 280 400 264 C397 252 385 248 377 256 C369 264 375 280 370 297 C362 325 342 345 315 357 C300 364 300 384 312 391Z"
        fill="url(#furLight)" stroke="#75492F" stroke-width="5" stroke-linejoin="round"/>
      <path d="M377 258 C378 247 386 242 394 246 C403 250 405 262 402 276 L373 275 C372 269 373 263 377 258Z"
        fill="#70432E" stroke="#75492F" stroke-width="4" stroke-linejoin="round"/>
      <path d="M389 249 L388 271 M399 252 L398 273" stroke="#A66B40" stroke-width="3" stroke-linecap="round"/>
      <path d="M315 365 Q327 359 339 359" fill="none" stroke="#E6B17E" stroke-width="4" stroke-linecap="round" opacity=".65"/>
    </g>
    </g>

    <!-- Head -->
    <path d="M117 231 C117 159 169 125 240 125 C311 125 363 159 363 231 L359 284 C355 337 310 365 240 365 C170 365 125 337 121 284Z"
      fill="url(#furLight)" stroke="#75492F" stroke-width="5" stroke-linejoin="round"/>
    <path d="M225 151 C214 177 211 205 217 225 C221 236 232 237 240 228 C249 218 254 181 240 151 C236 142 229 142 225 151Z" fill="#B9794B" opacity=".42"/>
    <path d="M142 281 C153 292 164 295 177 292" fill="none" stroke="#E8B180" stroke-width="5" stroke-linecap="round" opacity=".55"/>

    <!-- Cheeks -->
    <ellipse cx="158" cy="292" rx="16" ry="9" fill="#E99488" opacity=".5"/>
    <ellipse cx="322" cy="292" rx="16" ry="9" fill="#E99488" opacity=".5"/>

    <!-- Headphone ear cups -->
    <g>
      <rect x="91" y="220" width="48" height="83" rx="22" fill="#102D62" stroke="#0B234D" stroke-width="4"/>
      <rect x="98" y="228" width="34" height="67" rx="16" fill="url(#navy)"/>
      <circle cx="115" cy="261" r="8.5" fill="url(#gold)" stroke="#D5A72A" stroke-width="2"/>
      <rect x="341" y="220" width="48" height="83" rx="22" fill="#102D62" stroke="#0B234D" stroke-width="4"/>
      <rect x="348" y="228" width="34" height="67" rx="16" fill="url(#navy)"/>
      <circle cx="365" cy="261" r="8.5" fill="url(#gold)" stroke="#D5A72A" stroke-width="2"/>
      <g class="listen-rings">
        <circle cx="115" cy="261" r="23"/><circle cx="115" cy="261" r="23"/>
        <circle cx="365" cy="261" r="23"/><circle cx="365" cy="261" r="23"/>
      </g>
    </g>

    <!-- Eyes -->
    <g class="eyes">
      <g class="pupils">
        <ellipse cx="190" cy="238" rx="17" ry="22" fill="#241A16"/>
        <ellipse cx="290" cy="238" rx="17" ry="22" fill="#241A16"/>
        <ellipse cx="196" cy="230" rx="6.5" ry="8" fill="#FFFFFF"/>
        <ellipse cx="296" cy="230" rx="6.5" ry="8" fill="#FFFFFF"/>
        <circle cx="183" cy="246" r="2.5" fill="#8B5A3B" opacity=".55"/>
        <circle cx="283" cy="246" r="2.5" fill="#8B5A3B" opacity=".55"/>
      </g>
    </g>

    <!-- Muzzle and mouth -->
    <path d="M169 293 C177 270 204 259 240 259 C276 259 303 270 311 293 C319 319 295 346 263 353 C248 357 232 357 217 353 C185 346 161 319 169 293Z"
      fill="url(#muzzle)" stroke="#E8D1AB" stroke-width="3"/>
    <ellipse cx="240" cy="298" rx="17" ry="11.5" fill="#3B2920"/>
    <ellipse cx="234" cy="294" rx="5" ry="3" fill="#A78A74" opacity=".7"/>
    <path d="M240 307 L240 319" stroke="#4B3326" stroke-width="5" stroke-linecap="round"/>
    <path class="mouth-smile" d="M220 321 C229 336 251 336 260 321" fill="none" stroke="#4B3326" stroke-width="5" stroke-linecap="round"/>
    <g class="mouth-open">
      <ellipse cx="240" cy="326" rx="15" ry="17" fill="#4B2524"/>
      <path d="M228 333 Q240 342 252 333 Q249 343 240 343 Q231 343 228 333Z" fill="#E97978"/>
      <path d="M230 319 Q240 315 250 319" fill="none" stroke="#6D4033" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Collar / scarf -->
    <path d="M132 361 Q240 405 348 361 L350 389 Q240 434 130 389Z" fill="url(#gold)" stroke="#D2A329" stroke-width="4" stroke-linejoin="round"/>
    <path d="M143 376 Q240 414 337 376" fill="none" stroke="#FFF0A0" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    <circle cx="240" cy="397" r="27" fill="#10336F" stroke="#0B285B" stroke-width="4"/>
    <circle cx="231" cy="388" r="7" fill="#4772B6" opacity=".45"/>
    <text x="240" y="407" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="29" font-weight="800" fill="#FFD94F">S</text>

    <!-- Listening / thinking / success state decorations -->
    <g class="thinking-bubble">
      <path d="M356 131 C356 112 371 101 390 101 C409 101 423 113 423 130 C423 147 409 158 391 158 L378 158 L367 168 L369 153 C360 148 356 140 356 131Z"
        fill="#FFF7DF" stroke="#D7B35B" stroke-width="3"/>
      <g class="thinking-dots" fill="#9A6C37">
        <circle cx="377" cy="130" r="4.2"/><circle cx="391" cy="130" r="4.2"/><circle cx="405" cy="130" r="4.2"/>
      </g>
    </g>
    <g class="success-mark">
      <circle cx="392" cy="177" r="28" fill="#2E9B73" stroke="#FFFFFF" stroke-width="5"/>
      <path d="M378 177 L388 187 L407 166" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="success-sparkles" fill="none" stroke="#E7B938" stroke-width="4" stroke-linecap="round">
      <path d="M345 143 L345 158 M337 150 L353 150"/>
      <path d="M430 220 L430 232 M424 226 L436 226"/>
      <path d="M363 204 L363 214 M358 209 L368 209"/>
    </g>
  </g>
</svg>
