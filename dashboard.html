<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Sigi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    /* Dashboard bergaya catatan (Notion-like): netral, putih bersih, sidebar abu muda.
       Aksen memakai warna brand Sigi (teal). Menu dan halaman cukup teks, tanpa emoji. */
    @theme {
      --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --color-ink: #37352f;
      --color-muted: #6b6a66;
      --color-line: #e9e9e7;
      --color-side: #f7f7f5;
      --color-hover: #efefed;
      --color-callout: #f1f1ef;
      --color-brand: #0f766e;
      --color-brand-dark: #115e59;
      --color-mint: #ccfbf1;
    }
    @layer base {
      button, label[for] { cursor: pointer; }
      button:disabled { cursor: not-allowed; }
      :focus-visible { outline: 2px solid var(--color-brand); outline-offset: 2px; }
      ::selection { background-color: var(--color-mint); }
    }
    @layer components {
      .nav-item { @apply flex min-h-11 w-full items-center gap-2 rounded-md px-2 text-left text-ink hover:bg-hover lg:min-h-8 aria-[current=page]:bg-hover aria-[current=page]:font-semibold; }
      .nav-label { @apply px-2 pb-1 pt-4 text-xs font-semibold text-muted; }
      .btn { @apply inline-flex min-h-11 items-center justify-center gap-2 rounded-md border border-line bg-white px-3 text-sm font-medium text-ink hover:bg-hover sm:min-h-9 disabled:opacity-50; }
      .btn-primary { @apply border-brand bg-brand text-white hover:bg-brand-dark; }
      .btn-danger { @apply border-red-200 text-red-700 hover:bg-red-50; }
      .field { @apply min-h-11 w-full min-w-0 rounded-md border border-line bg-white px-3 text-base text-ink placeholder:text-muted focus:border-brand focus:ring-2 focus:ring-brand/20 focus-visible:outline-hidden sm:min-h-10 sm:text-sm; }
      .label { @apply block text-sm font-semibold text-ink; }
      .callout { @apply flex gap-3 rounded-md bg-callout p-4 text-sm leading-relaxed; }
      .chip { @apply inline-flex items-center rounded px-1.5 py-0.5 text-xs font-medium; }
    }
  </style>
</head>
<body class="bg-white font-sans text-ink antialiased lg:h-dvh lg:overflow-hidden">
  <div class="flex min-h-dvh lg:h-dvh">
    <div id="sidebar-backdrop" class="fixed inset-0 z-30 bg-black/30 lg:hidden" hidden></div>

    <aside id="sidebar" aria-label="Navigasi dashboard"
      class="fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col border-r border-line bg-side transition-transform duration-200 lg:static lg:w-64 lg:translate-x-0">
      <div class="flex items-center gap-2 px-3 pb-2 pt-3">
        <div class="flex min-w-0 flex-1 items-center gap-2.5 px-2 py-1.5">
          <span id="school-avatar" class="grid size-7 shrink-0 place-items-center rounded-md text-sm font-bold" aria-hidden="true"></span>
          <div class="min-w-0">
            <p id="school-name" class="truncate text-sm font-semibold"></p>
            <p class="text-xs text-muted">Sigi · mode demo</p>
          </div>
        </div>
        <button id="btn-close-sidebar" type="button" aria-label="Tutup navigasi" class="grid size-11 place-items-center rounded-md text-muted hover:bg-hover lg:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="size-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <nav class="flex-1 overflow-y-auto px-2 pb-4 text-sm" aria-label="Menu dashboard">
        <p class="nav-label">Sekolah</p>
        <a href="#/info" data-nav="info" class="nav-item">Info sekolah</a>
        <ul id="nav-pages" class="ml-3 border-l border-line pl-1" aria-label="Halaman info sekolah"></ul>
        <button id="btn-add-page" type="button" class="nav-item text-muted"><span class="w-5 shrink-0 text-center" aria-hidden="true">+</span>Tambah halaman</button>
        <a href="#/dokumen" data-nav="dokumen" class="nav-item">Dokumen PDF</a>

        <p class="nav-label">Chatbot</p>
        <a href="#/uji" data-nav="uji" class="nav-item">Uji chatbot</a>
        <a href="#/tampilan" data-nav="tampilan" class="nav-item">Tampilan widget</a>
        <a href="#/pasang" data-nav="pasang" class="nav-item">Pasang di website</a>
        <a href="#/percakapan" data-nav="percakapan" class="nav-item">Percakapan</a>
      </nav>

      <div class="space-y-2 border-t border-line p-4 text-xs text-muted">
        <p>Mode demo: perubahan tersimpan di browser ini saja.</p>
        <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
          <a href="index.html" class="inline-flex min-h-8 items-center font-medium text-ink hover:underline">Website</a>
          <a href="demo-wikrama.html" target="_blank" rel="noopener" class="inline-flex min-h-8 items-center font-medium text-ink hover:underline">Demo sekolah</a>
          <button id="btn-reset" type="button" class="inline-flex min-h-8 items-center font-medium text-red-700 hover:underline">Reset data demo</button>
        </div>
      </div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="sticky top-0 z-20 flex h-12 shrink-0 items-center gap-2 border-b border-line bg-white/95 px-2 backdrop-blur sm:px-4">
        <button id="btn-open-sidebar" type="button" aria-label="Buka navigasi" aria-controls="sidebar" aria-expanded="false" class="grid size-11 shrink-0 place-items-center rounded-md text-muted hover:bg-hover lg:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="size-5"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
        </button>
        <nav id="breadcrumb" aria-label="Lokasi halaman" class="flex min-w-0 flex-1 items-center gap-0.5 text-sm"></nav>
        <span id="save-status" role="status" aria-live="polite" class="shrink-0 text-xs text-muted"></span>
        <a href="demo-wikrama.html" target="_blank" rel="noopener" class="btn hidden sm:inline-flex">Lihat di demo ↗</a>
      </header>
      <main id="view" tabindex="-1" class="flex-1 focus:outline-none lg:overflow-y-auto"></main>
    </div>
  </div>

  <!-- Data sekolah dan widget. Widget di pojok kanan bawah dipakai untuk menguji chatbot dengan isi dashboard terbaru. -->
  <!-- ?v=… memaksa browser mengambil versi terbaru, bukan salinan lama dari cache. Naikkan angkanya setiap kali widget.js atau sekolah/wikrama.js diubah. -->
  <script src="sekolah/wikrama.js?v=20261126b"></script>
  <script src="widget.js?v=20261126b"></script>
  <script>
'use strict';

const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
const PDFJS_WORKER_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
// Ikon SVG yang sama dengan widget, untuk pratinjau di halaman Tampilan widget. String tetap, bukan data pengguna.
const ICON_BOT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="size-[18px]"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>';
const ICON_MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="size-[18px]"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5V22M8 22h8"/></svg>';
const ICON_SEND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="size-[18px]"><path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z"/><path d="M6 12h16"/></svg>';

const api = window.SigiWidget;
const el = {
  sidebar: document.getElementById('sidebar'),
  backdrop: document.getElementById('sidebar-backdrop'),
  openSidebar: document.getElementById('btn-open-sidebar'),
  closeSidebar: document.getElementById('btn-close-sidebar'),
  navPages: document.getElementById('nav-pages'),
  addPage: document.getElementById('btn-add-page'),
  reset: document.getElementById('btn-reset'),
  schoolName: document.getElementById('school-name'),
  schoolAvatar: document.getElementById('school-avatar'),
  breadcrumb: document.getElementById('breadcrumb'),
  status: document.getElementById('save-status'),
  view: document.getElementById('view'),
};

if (!api) {
  el.view.textContent = 'Widget Sigi gagal dimuat. Pastikan file sekolah/wikrama.js dan widget.js ada.';
  throw new Error('SigiWidget tidak ditemukan');
}

// Data sekolah yang sedang diedit. Disimpan ke browser (localStorage) lewat widget, supaya chatbot ikut memakainya.
let school = api.data.load();
let current = { view: 'info', id: null };

/* Bantuan kecil */

const numberFormat = new Intl.NumberFormat('id-ID');

// Teks dari pengguna dan dari PDF selalu dimasukkan lewat textContent, bukan innerHTML.
function make(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function button(label, className, onClick) {
  const node = make('button', className, label);
  node.type = 'button';
  node.addEventListener('click', onClick);
  return node;
}

function formatUpdated(time) {
  if (!time) return 'Bawaan';
  const date = new Date(time);
  const clock = date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  if (date.toDateString() === new Date().toDateString()) return `Hari ini ${clock}`;
  return `${date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })} ${clock}`;
}

function autoresize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = `${textarea.scrollHeight + 2}px`;
}

function newId(prefix) {
  return `${prefix}${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
}

/* Menyimpan */

let saveTimer = null;

function setStatus(text, isError = false) {
  el.status.textContent = text;
  el.status.className = `shrink-0 text-xs ${isError ? 'font-semibold text-red-700' : 'text-muted'}`;
}

// Simpan otomatis sebentar setelah pengguna berhenti mengetik, seperti aplikasi catatan.
function persist({ now = false } = {}) {
  clearTimeout(saveTimer);
  setStatus('Menyimpan…');
  const run = () => {
    try {
      api.data.save(school);
      setStatus('Tersimpan');
      return true;
    } catch (error) {
      console.error(error);
      setStatus('Gagal menyimpan: penyimpanan browser penuh', true);
      return false;
    }
  };
  if (now) return run();
  saveTimer = setTimeout(run, 400);
  return true;
}

/* Kerangka halaman */

function shell() {
  const wrap = make('div', 'mx-auto w-full max-w-3xl px-5 pb-28 pt-10 sm:px-12 sm:pt-14');
  el.view.replaceChildren(wrap);
  return wrap;
}

function pageHeader(title, description) {
  const box = make('div');
  box.append(make('h1', 'text-3xl font-bold tracking-tight sm:text-4xl', title));
  if (description) box.append(make('p', 'mt-3 max-w-2xl leading-relaxed text-muted', description));
  return box;
}

function callout(content, extraClass = '') {
  const box = make('div', `callout ${extraClass}`);
  const body = typeof content === 'string' ? make('p', '', content) : content;
  box.append(body);
  return box;
}

function setBreadcrumb(items) {
  el.breadcrumb.replaceChildren();
  items.forEach((item, index) => {
    if (index > 0) el.breadcrumb.append(make('span', 'text-muted', '/'));
    const node = item.href
      ? make('a', 'min-w-0 truncate rounded px-1.5 py-1 text-muted hover:bg-hover hover:text-ink', item.label)
      : make('span', 'min-w-0 truncate px-1.5 py-1 font-medium', item.label);
    if (item.href) node.href = item.href;
    el.breadcrumb.append(node);
  });
  document.title = `${items[items.length - 1].label} · Dashboard Sigi`;
}

/* Sidebar */

function renderSidebar() {
  el.schoolName.textContent = school.schoolName;
  el.schoolAvatar.textContent = (school.schoolName.trim()[0] || 'S').toUpperCase();
  el.schoolAvatar.style.background = school.colors.primary;
  el.schoolAvatar.style.color = school.colors.onPrimary;

  el.navPages.replaceChildren(...school.pages.map((page) => {
    const item = make('li');
    const link = make('a', 'nav-item');
    link.href = `#/halaman/${page.id}`;
    link.append(make('span', 'truncate', page.title.trim() || 'Tanpa judul'));
    if (current.view === 'halaman' && current.id === page.id) link.setAttribute('aria-current', 'page');
    item.append(link);
    return item;
  }));

  for (const link of document.querySelectorAll('[data-nav]')) {
    if (link.dataset.nav === current.view) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  }
}

const desktop = window.matchMedia('(min-width: 1024px)');

function openSidebar() {
  el.sidebar.classList.remove('-translate-x-full');
  el.sidebar.inert = false;
  el.backdrop.hidden = false;
  el.openSidebar.setAttribute('aria-expanded', 'true');
  el.closeSidebar.focus();
}

function closeSidebar({ restoreFocus = false } = {}) {
  if (desktop.matches) return;
  el.sidebar.classList.add('-translate-x-full');
  el.sidebar.inert = true; // sidebar yang tersembunyi di HP tidak bisa dijangkau Tab
  el.backdrop.hidden = true;
  el.openSidebar.setAttribute('aria-expanded', 'false');
  if (restoreFocus) el.openSidebar.focus();
}

function syncSidebarMode() {
  if (desktop.matches) {
    el.sidebar.inert = false;
    el.backdrop.hidden = true;
  } else {
    closeSidebar();
  }
}

/* Halaman: Info sekolah (daftar) */

function renderInfo() {
  setBreadcrumb([{ label: school.schoolName, href: '#/info' }, { label: 'Info sekolah' }]);
  const wrap = shell();
  wrap.append(pageHeader('Info sekolah', 'Setiap halaman di bawah jadi bahan jawaban Asisten SPMB. Perubahan langsung dipakai chatbot, di dashboard ini dan di halaman demo sekolah.'));

  const contextLength = api.data.compileContext(school).length;
  const tokens = Math.ceil(api.data.systemPrompt(school).length / 4);
  const stats = make('p', 'mt-6 flex flex-wrap gap-x-5 gap-y-1 text-sm text-muted');
  stats.append(
    make('span', '', `${school.pages.length} halaman`),
    make('span', '', `${school.documents.length} PDF`),
    make('span', '', `${numberFormat.format(contextLength)} dari ${numberFormat.format(api.data.maxContextChars)} karakter`),
    make('span', '', `≈${numberFormat.format(tokens)} token per pertanyaan`),
  );
  wrap.append(stats);
  if (contextLength > api.data.maxContextChars) {
    wrap.append(callout('Info sekolah melebihi batas 60.000 karakter, jadi bagian akhirnya akan dipotong. Ringkas halaman yang panjang atau hapus PDF yang tidak perlu.', 'mt-4 bg-amber-50 text-amber-900'));
  }

  const table = make('div', 'mt-8 overflow-hidden rounded-lg border border-line');
  const cols = 'grid grid-cols-[minmax(0,1fr)_5.5rem] items-center gap-3 sm:grid-cols-[minmax(0,1fr)_6rem_9rem]';
  const head = make('div', `${cols} border-b border-line bg-side px-3 py-2 text-xs font-semibold text-muted`);
  head.append(make('span', '', 'Halaman'), make('span', 'text-right', 'Karakter'), make('span', 'hidden sm:block', 'Terakhir diubah'));
  table.append(head);

  for (const page of school.pages) {
    const row = make('a', `${cols} min-h-11 border-b border-line px-3 py-2 last:border-b-0 hover:bg-hover`);
    row.href = `#/halaman/${page.id}`;
    const name = make('span', 'flex min-w-0 items-center gap-2 font-medium');
    name.append(make('span', 'truncate', page.title.trim() || 'Tanpa judul'));
    row.append(
      name,
      make('span', 'text-right text-sm tabular-nums text-muted', numberFormat.format(page.body.length)),
      make('span', 'hidden text-sm text-muted sm:block', formatUpdated(page.updatedAt)),
    );
    table.append(row);
  }
  table.append(button('+ Halaman baru', 'flex min-h-11 w-full items-center px-3 text-left text-sm text-muted hover:bg-hover', addPage));
  wrap.append(table);

  wrap.append(callout('Tulis seperti menjelaskan ke CS baru: singkat, jelas, dan pakai poin-poin. Info yang tidak ada di halaman mana pun akan dijawab "belum tersedia", lalu calon murid diarahkan ke CS SPMB.', 'mt-8'));
}

/* Halaman: editor satu halaman */

function renderPage(id) {
  const page = school.pages.find((item) => item.id === id);
  if (!page) {
    setBreadcrumb([{ label: school.schoolName, href: '#/info' }, { label: 'Halaman tidak ditemukan' }]);
    const wrap = shell();
    wrap.append(pageHeader('Halaman tidak ditemukan', 'Mungkin halaman ini sudah dihapus.'));
    const back = make('a', 'btn mt-6', '← Kembali ke Info sekolah');
    back.href = '#/info';
    wrap.append(back);
    return;
  }

  const crumb = () => setBreadcrumb([
    { label: school.schoolName, href: '#/info' },
    { label: 'Info sekolah', href: '#/info' },
    { label: page.title.trim() || 'Tanpa judul' },
  ]);
  crumb();
  const wrap = shell();

  // Judul yang terlihat berupa kolom isian, jadi pembaca layar diberi h1 tersembunyi dengan teks yang sama.
  const heading = make('h1', 'sr-only', page.title.trim() || 'Tanpa judul');
  const title = make('input', 'w-full rounded-md border-0 bg-transparent text-3xl font-bold tracking-tight text-ink placeholder:text-muted focus:outline-none focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand/40 sm:text-4xl');
  title.value = page.title;
  title.placeholder = 'Tanpa judul';
  title.setAttribute('aria-label', 'Judul halaman');

  const meta = make('p', 'mt-2 text-sm text-muted');
  const updateMeta = () => {
    meta.textContent = `${numberFormat.format(page.body.length)} karakter · ${page.updatedAt ? `diubah ${formatUpdated(page.updatedAt).toLowerCase()}` : 'isi bawaan'}`;
  };
  updateMeta();

  const body = make('textarea', 'mt-6 w-full resize-none rounded-md border-0 bg-transparent text-base leading-7 text-ink placeholder:text-muted focus:outline-none focus-visible:outline-2 focus-visible:outline-offset-8 focus-visible:outline-brand/30');
  body.value = page.body;
  body.placeholder = 'Tulis info untuk calon murid di sini…';
  body.setAttribute('aria-label', 'Isi halaman');

  title.addEventListener('input', () => {
    page.title = title.value;
    page.updatedAt = Date.now();
    heading.textContent = title.value.trim() || 'Tanpa judul';
    updateMeta();
    persist();
    renderSidebar();
    crumb();
  });
  title.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      body.focus();
    }
  });
  body.addEventListener('input', () => {
    page.body = body.value;
    page.updatedAt = Date.now();
    updateMeta();
    autoresize(body);
    persist();
  });

  const actions = make('div', 'mt-10 flex flex-wrap gap-2 border-t border-line pt-6');
  actions.append(
    button('Coba tanya di chatbot', 'btn', () => api.open()),
    button('Hapus halaman', 'btn btn-danger', () => {
      const name = page.title.trim() || 'Tanpa judul';
      if (!window.confirm(`Hapus halaman "${name}"? Isinya tidak akan dipakai chatbot lagi.`)) return;
      school.pages = school.pages.filter((item) => item.id !== page.id);
      persist({ now: true });
      location.hash = '#/info';
    }),
  );

  wrap.append(heading, title, meta, body, actions);
  autoresize(body);
  if (focusTitleOnOpen) {
    focusTitleOnOpen = false;
    title.focus();
  }
}

// Halaman baru langsung siap diketik judulnya, seperti di aplikasi catatan.
let focusTitleOnOpen = false;

function addPage() {
  const page = { id: newId('p'), title: '', body: '', updatedAt: Date.now() };
  school.pages.push(page);
  persist({ now: true });
  focusTitleOnOpen = true;
  location.hash = `#/halaman/${page.id}`;
}

/* Halaman: Dokumen PDF (logika pdf.js sama dengan Tingkat 2 tutorial) */

let pdfjsPromise = null;

function loadPdfJs() {
  if (!pdfjsPromise) {
    pdfjsPromise = import(PDFJS_URL)
      .then((pdfjsLib) => {
        pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
        return pdfjsLib;
      })
      .catch((error) => {
        pdfjsPromise = null;
        throw error;
      });
  }
  return pdfjsPromise;
}

async function extractPdfText(file) {
  const pdfjsLib = await loadPdfJs();
  const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await pdfjsLib.getDocument({ data }).promise;
  const pageTexts = [];
  for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
    const content = await (await pdf.getPage(pageNumber)).getTextContent();
    pageTexts.push(content.items.map((item) => item.str + (item.hasEOL ? '\n' : ' ')).join('').trim());
  }
  const pages = pdf.numPages;
  await pdf.destroy();
  return { pages, text: pageTexts.join('\n\n').replace(/[ \t]+/g, ' ').trim() };
}

function renderDocuments(statusMessage, statusTone) {
  setBreadcrumb([{ label: school.schoolName, href: '#/info' }, { label: 'Dokumen PDF' }]);
  const wrap = shell();
  wrap.append(pageHeader('Dokumen PDF', 'Unggah brosur atau info SPMB dalam bentuk PDF. Teksnya dibaca di browser dan ikut jadi bahan jawaban.'));

  const drop = make('label', 'mt-8 flex cursor-pointer flex-col items-center justify-center gap-2 rounded-lg border-2 border-dashed border-line px-6 py-10 text-center hover:bg-side');
  drop.htmlFor = 'pdf-input';

async function handlePdfFiles(fileList) {
  const files = Array.from(fileList);
  if (files.length === 0) return;
  const status = document.getElementById('pdf-status');
  status.textContent = `Membaca ${files.length} PDF...`;

  try {
    await loadPdfJs();
  } catch (error) {
    console.error(error);
    renderDocuments('Pembaca PDF gagal dimuat. Periksa koneksi internet, lalu pilih file lagi.', 'error');
    return;
  }

  const failed = [];
  const added = [];
  for (const file of files) {
    if (!file.name.toLowerCase().endsWith('.pdf')) {
      failed.push(`${file.name} (bukan PDF)`);
      continue;
    }
    if (school.documents.some((doc) => doc.name === file.name && doc.size === file.size)) {
      failed.push(`${file.name} (sudah ada di daftar)`);
      continue;
    }
    try {
      const result = await extractPdfText(file);
      if (!result.text) {
        failed.push(`${file.name} (tidak ada teks, mungkin hasil scan)`);
        continue;
      }
      added.push({ id: newId('d'), name: file.name, size: file.size, pages: result.pages, text: result.text, addedAt: Date.now() });
    } catch (error) {
      console.error(error);
      failed.push(`${file.name} (rusak atau terkunci password)`);
    }
  }

  if (added.length > 0) {
    school.documents.push(...added);
    if (!persist({ now: true })) {
      // Penyimpanan browser penuh: batalkan supaya data di layar sama dengan yang tersimpan.
      school.documents = school.documents.filter((doc) => !added.includes(doc));
      renderDocuments('PDF terlalu besar untuk disimpan di browser (mode demo). Coba PDF yang lebih kecil.', 'error');
      return;
    }
  }

  const prefix = added.length > 0 ? `${added.length} PDF berhasil dibaca. ` : '';
  if (failed.length > 0) renderDocuments(`${prefix}Tidak bisa dipakai: ${failed.join(', ')}.`, 'error');
  else renderDocuments(`${added.length} PDF berhasil dibaca.`, 'success');
}

function hexToRgb(hex) {
  const value = hex.replace('#', '');
  const full = value.length === 3 ? value.split('').map((c) => c + c).join('') : value;
  const number = parseInt(full, 16);
  return [(number >> 16) & 255, (number >> 8) & 255, number & 255];
}

function luminance(hex) {
  return hexToRgb(hex)
    .map((value) => {
      const v = value / 255;
      return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
    })
    .reduce((sum, v, i) => sum + v * [0.2126, 0.7152, 0.0722][i], 0);
}

function contrast(a, b) {
  const [light, dark] = [luminance(a), luminance(b)].sort((x, y) => y - x);
  return (light + 0.05) / (dark + 0.05);
}

// Warna teks di atas warna latar dipilih otomatis: putih atau hampir hitam, mana yang lebih kontras.
function textOn(background) {
  return contrast(background, '#ffffff') >= contrast(background, '#0f172a') ? '#ffffff' : '#0f172a';
}

function formatWibDateTime(iso) {
  if (!iso) return '-';
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return '-';
  return `${date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', timeZone: 'Asia/Jakarta' })} ${date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta' })} WIB`;
}

function formatSecondsDuration(seconds) {
  if (!Number.isFinite(seconds) || seconds <= 0) return '0 dtk';
  if (seconds < 60) return `${seconds} dtk`;
  const mins = Math.floor(seconds / 60);
  const rem = seconds % 60;
  return rem > 0 ? `${mins} mnt ${rem} dtk` : `${mins} mnt`;
}

function renderLoginPrompt(container, onSuccess) {
  const box = make('div', 'mt-8 max-w-md rounded-lg border border-line bg-side p-5');
  box.append(
    make('h2', 'text-base font-bold text-ink', 'Masuk untuk melihat ringkasan percakapan'),
    make('p', 'mt-1 text-sm text-muted', 'Halaman ini menampilkan pertanyaan calon murid yang masuk ke server. Masukkan password Sigi (SIGI_PASSWORD).'),
  );
  const form = make('form', 'mt-4 flex flex-col gap-2 sm:flex-row');
  const input = make('input', 'field flex-1');
  input.type = 'password';
  input.autocomplete = 'current-password';
  input.placeholder = 'Password Sigi';
  input.setAttribute('aria-label', 'Password Sigi');
  const submit = make('button', 'btn btn-primary shrink-0', 'Masuk');
  submit.type = 'submit';
  const errText = make('p', 'mt-2 text-sm font-medium text-red-700');
  errText.setAttribute('role', 'alert');
  errText.hidden = true;

  form.append(input, submit);
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = input.value.trim();
    if (!password) {
      input.focus();
      return;
    }
    submit.disabled = true;
    submit.textContent = 'Memeriksa...';
    errText.hidden = true;
    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (response.ok) {
        onSuccess();
        return;
      }
      const data = await response.json().catch(() => null);
      errText.textContent = data?.error?.message || `Gagal masuk (kode ${response.status}).`;
      errText.hidden = false;
    } catch {
      errText.textContent = 'Tidak bisa terhubung ke server Sigi.';
      errText.hidden = false;
    } finally {
      submit.disabled = false;
      submit.textContent = 'Masuk';
    }
  });

  box.append(form, errText);
  container.append(box);
}

  periodWrap.append(periodLabel, periodSelect);

  const refreshBtn = button('Muat ulang', 'btn shrink-0', () => loadAnalytics());
  toolbar.append(daysWrap, periodWrap, refreshBtn);
  wrap.append(toolbar);

  const body = make('div', 'mt-6');
  body.setAttribute('aria-live', 'polite');
  wrap.append(body);

  const schoolId = window.Sigi?.id || 'wikrama';
  let activeRequest = 0;

  daysSelect.addEventListener('change', () => {
    analyticsFilter.days = daysSelect.value;
    loadAnalytics();
  });
  periodSelect.addEventListener('change', () => {
    analyticsFilter.period = periodSelect.value;
    loadAnalytics();
  });

  function syncPeriodOptions(periods) {
    const selected = analyticsFilter.period;
    const list = Array.isArray(periods) ? periods : [];
    const options = [allPeriodOpt];
    for (const p of list) {
      const opt = make('option', '', `TA ${p}`);
      opt.value = p;
      options.push(opt);
    }
    periodSelect.replaceChildren(...options);
    periodSelect.value = list.includes(selected) ? selected : '';
    analyticsFilter.period = periodSelect.value;
  }

  function showLoading() {
    const box = make('div', 'rounded-lg border border-line bg-side p-6 text-sm text-muted');
    box.textContent = 'Memuat ringkasan percakapan dari server...';
    body.replaceChildren(box);
  }

  function renderAnalyticsData(data) {
    syncPeriodOptions(data.periods);
    const s = data.summary || {};
    const totalQuestions = Number(s.total_questions) || 0;
    const totalConversations = Number(s.total_conversations) || 0;
    const widgetOpens = Number(s.widget_opens) || 0;

    const nodes = [];

    // Ringkasan angka nyata di satu jalur horizontal agar tidak menyerupai grid kartu generik.
    const statsGrid = make('dl', 'grid grid-cols-[minmax(0,1fr)] gap-4 border-b border-line pb-6 sm:grid-cols-2 lg:grid-cols-4');
    const statItems = [
      ['Pertanyaan masuk', `${numberFormat.format(totalQuestions)}`, `${numberFormat.format(totalConversations)} sesi percakapan`],
      ['Belum terjawab', `${numberFormat.format(s.unanswered_count || 0)} (${String(s.unanswered_rate ?? 0).replace('.', ',')}%)`, 'Memicu saran hubungi CS SPMB'],
      ['Channel interaksi', `${numberFormat.format(s.channels?.chat || 0)} chat · ${numberFormat.format(s.channels?.mic || 0)} mic`, `${numberFormat.format(s.channels?.call || 0)} tanya telepon · rata-rata ${formatSecondsDuration(s.avg_call_duration_seconds || 0)}`],
      ['Widget & pemakaian AI', `${numberFormat.format(widgetOpens)} buka · ${numberFormat.format(s.suggestion_clicks || 0)} klik saran`, `${numberFormat.format(s.total_tokens || 0)} token · rata-rata ${numberFormat.format(s.avg_latency_ms || 0)} ms${s.error_count ? ` · ${s.error_count} gagal` : ''}`],
    ];
    for (const [label, value, sub] of statItems) {
      const item = make('div', 'min-w-0');
      item.append(
        make('dt', 'text-xs font-semibold text-muted', label),
        make('dd', 'mt-1 text-xl font-bold tabular-nums text-ink', value),
        make('dd', 'mt-0.5 text-xs text-muted break-words', sub),
      );
      statsGrid.append(item);
    }
    nodes.push(statsGrid);

    if (totalQuestions === 0 && widgetOpens === 0) {
      const empty = make('div', 'mt-8 rounded-lg border border-line bg-side p-6');
      empty.append(
        make('h2', 'text-lg font-bold text-ink', 'Belum ada percakapan di rentang waktu ini'),
        make('p', 'mt-2 max-w-xl text-sm leading-relaxed text-muted', 'Kirim pertanyaan contoh lewat Uji chatbot atau coba telepon Sigi. Setelah ada pertanyaan masuk, daftar topik dan jam ramai langsung muncul di sini.'),
      );
      const actions = make('div', 'mt-4 flex flex-wrap gap-2');
      const testLink = make('a', 'btn btn-primary', 'Buka Uji chatbot');
      testLink.href = '#/uji';
      actions.append(testLink);
      empty.append(actions);
      nodes.push(empty);
      body.replaceChildren(...nodes);
      return;
    }

    // Bagian 1: Pertanyaan yang belum terjawab (aksi utama panitia SPMB).
    const gapSection = make('section', 'mt-8');
    const gapHeader = make('div', 'flex flex-wrap items-start justify-between gap-3');
    const gapTitleWrap = make('div', 'min-w-0');
    gapTitleWrap.append(
      make('h2', 'text-lg font-bold text-ink', 'Pertanyaan yang belum terjawab'),
      make('p', 'mt-1 text-sm text-muted', 'Pertanyaan yang dijawab "belum tersedia" atau diarahkan ke CS SPMB. Tambahkan datanya di Info sekolah agar Sigi bisa menjawab langsung.'),
    );
    const infoLink = make('a', 'btn shrink-0', 'Kelola Info sekolah');
    infoLink.href = '#/info';
    gapHeader.append(gapTitleWrap, infoLink);
    gapSection.append(gapHeader);

    const unanswered = Array.isArray(data.unanswered_questions) ? data.unanswered_questions : [];
    if (unanswered.length === 0) {
      gapSection.append(callout('Semua pertanyaan di periode ini sudah memiliki jawaban di data sekolah.', 'mt-4 bg-emerald-50 text-emerald-900'));
    } else {
      const list = make('ul', 'mt-4 divide-y divide-line overflow-hidden rounded-lg border border-line');
      for (const item of unanswered) {
        const row = make('li', 'flex flex-col gap-2 px-4 py-3 sm:flex-row sm:items-start sm:justify-between sm:gap-4');
        const textWrap = make('div', 'min-w-0 flex-1');
        textWrap.append(
          make('p', 'font-medium text-ink break-words', item.question),
          make('p', 'mt-1 text-xs leading-relaxed text-muted break-words', `Jawaban Sigi: ${item.answer_preview}`),
        );
        const metaWrap = make('div', 'flex shrink-0 flex-wrap items-center gap-2 text-xs text-muted');
        metaWrap.append(
          make('span', 'chip bg-amber-50 text-amber-900', topicLabel(item.topic)),
          make('span', '', channelLabel(item.channel)),
          make('span', '', formatWibDateTime(item.created_at)),
        );
        row.append(textWrap, metaWrap);
        list.append(row);
      }
      gapSection.append(list);
    }
    nodes.push(gapSection);

    // Bagian 2: Topik populer & pertanyaan paling sering muncul.
    const topicsAndPopular = make('section', 'mt-10 grid grid-cols-[minmax(0,1fr)] gap-8 lg:grid-cols-2');

    const topicsCol = make('div', 'min-w-0');
    topicsCol.append(
      make('h2', 'text-lg font-bold text-ink', 'Topik yang paling dicari'),
      make('p', 'mt-1 text-sm text-muted', 'Pengelompokan otomatis pertanyaan calon murid.'),
    );
    const topics = Array.isArray(data.topics) ? data.topics : [];
    if (topics.length === 0) {
      topicsCol.append(make('p', 'mt-4 text-sm text-muted', 'Belum ada pertanyaan masuk.'));
    } else {
      const maxTopicCount = Math.max(...topics.map((t) => Number(t.question_count) || 0), 1);
      const topicList = make('ul', 'mt-4 space-y-3');
      for (const t of topics) {
        const count = Number(t.question_count) || 0;
        const pct = Math.max(4, Math.round((count / maxTopicCount) * 100));
        const li = make('li', 'min-w-0');
        const row = make('div', 'flex items-baseline justify-between gap-2 text-sm');
        const left = make('span', 'truncate font-medium text-ink', topicLabel(t.topic));
        const rightText = t.unanswered_count > 0
          ? `${numberFormat.format(count)} (${t.unanswered_count} belum terjawab)`
          : `${numberFormat.format(count)}`;
        row.append(left, make('span', 'shrink-0 tabular-nums text-xs text-muted', rightText));
        const track = make('div', 'mt-1.5 h-2 w-full overflow-hidden rounded-full bg-callout');
        track.setAttribute('aria-hidden', 'true');
        const fill = make('div', 'h-full rounded-full bg-brand');
        fill.style.width = `${pct}%`;
        track.append(fill);
        li.append(row, track);
        topicList.append(li);
      }
      topicsCol.append(topicList);
    }

    const popularCol = make('div', 'min-w-0');
    popularCol.append(
      make('h2', 'text-lg font-bold text-ink', 'Pertanyaan paling sering muncul'),
      make('p', 'mt-1 text-sm text-muted', 'Pertanyaan berulang dengan redaksi yang sama.'),
    );
    const popular = Array.isArray(data.popular_questions) ? data.popular_questions : [];
    if (popular.length === 0) {
      popularCol.append(make('p', 'mt-4 text-sm text-muted', 'Belum ada pertanyaan masuk.'));
    } else {
      const popList = make('ol', 'mt-4 divide-y divide-line overflow-hidden rounded-lg border border-line');
      for (const item of popular) {
        const li = make('li', 'flex items-start justify-between gap-3 px-3.5 py-2.5');
        const info = make('div', 'min-w-0 flex-1');
        info.append(
          make('p', 'text-sm font-medium text-ink break-words', item.question),
          make('p', 'mt-0.5 text-xs text-muted', `${topicLabel(item.topic)} · terakhir ${formatWibDateTime(item.last_asked_at)}`),
        );
        const countChip = make('span', 'chip shrink-0 bg-callout tabular-nums text-ink', `${numberFormat.format(item.count)}x`);
        li.append(info, countChip);
        popList.append(li);
      }
      popularCol.append(popList);
    }
    topicsAndPopular.append(topicsCol, popularCol);
    nodes.push(topicsAndPopular);

    // Bagian 3: Jam & hari paling ramai (WIB).
    const peakSection = make('section', 'mt-10 border-t border-line pt-8');
    const hours = Array.isArray(data.peak_hours) ? data.peak_hours : [];
    const days = Array.isArray(data.peak_days) ? data.peak_days : [];
    const maxHour = Math.max(...hours.map((h) => Number(h.count) || 0), 0);
    const busiestHour = maxHour > 0 ? hours.find((h) => Number(h.count) === maxHour) : null;
    const maxDay = Math.max(...days.map((d) => Number(d.count) || 0), 0);
    const busiestDay = maxDay > 0 ? days.find((d) => Number(d.count) === maxDay) : null;

    peakSection.append(
      make('h2', 'text-lg font-bold text-ink', 'Jam berapa calon murid paling banyak bertanya? (WIB)'),
      make(
        'p',
        'mt-1 text-sm text-muted',
        busiestHour
          ? `Puncak pertanyaan di pukul ${String(busiestHour.hour).padStart(2, '0')}.00 WIB (${numberFormat.format(maxHour)} pertanyaan)${busiestDay ? ` · Hari teramai: ${busiestDay.label} (${numberFormat.format(maxDay)})` : ''}.`
          : 'Belum ada distribusi waktu pertanyaan.',
      ),
    );

    if (hours.length === 24) {
      const chartBox = make('div', 'mt-4 rounded-lg border border-line p-4');
      const bars = make('div', 'grid h-28 grid-cols-[repeat(24,minmax(0,1fr))] items-end gap-0.5 sm:gap-1');
      for (const h of hours) {
        const count = Number(h.count) || 0;
        const heightPct = maxHour > 0 && count > 0 ? Math.max(10, Math.round((count / maxHour) * 100)) : 4;
        const col = make('div', 'flex h-full flex-col justify-end');
        const label = `Pukul ${String(h.hour).padStart(2, '0')}:00 WIB: ${numberFormat.format(count)} pertanyaan`;
        col.title = label;
        const bar = make('div', `w-full rounded-t ${count > 0 ? 'bg-brand' : 'bg-callout'}`);
        bar.style.height = `${heightPct}%`;
        bar.setAttribute('aria-label', label);
        col.append(bar);
        bars.append(col);
      }
      const axis = make('div', 'mt-2 flex justify-between text-xs tabular-nums text-muted');
      for (const tick of ['00.00', '06.00', '12.00', '18.00', '23.00']) axis.append(make('span', '', tick));
      chartBox.append(bars, axis);

      if (days.length > 0) {
        const dayRow = make('div', 'mt-4 flex flex-wrap gap-2 border-t border-line pt-3 text-xs');
        for (const d of days) {
          const badge = make('span', `chip tabular-nums ${Number(d.count) > 0 && Number(d.count) === maxDay ? 'bg-mint text-brand-dark' : 'bg-callout text-muted'}`, `${d.label}: ${numberFormat.format(d.count)}`);
          dayRow.append(badge);
        }
        chartBox.append(dayRow);
      }
      peakSection.append(chartBox);
    }
    nodes.push(peakSection);

    // Bagian 4: Riwayat percakapan terbaru (dapat dibuka per sesi untuk inspeksi panitia).
    const recentSection = make('section', 'mt-10 border-t border-line pt-8');
    recentSection.append(
      make('h2', 'text-lg font-bold text-ink', 'Riwayat percakapan terbaru'),
      make('p', 'mt-1 text-sm text-muted', 'Klik baris sesi untuk membaca isi tanya-jawab. Nomor HP, email, NIK, dan NISN disensor otomatis sebelum disimpan.'),
    );
    const recent = Array.isArray(data.recent_conversations) ? data.recent_conversations : [];
    if (recent.length === 0) {
      recentSection.append(make('p', 'mt-4 text-sm text-muted', 'Belum ada sesi percakapan yang tersimpan.'));
    } else {
      const stack = make('div', 'mt-4 divide-y divide-line overflow-hidden rounded-lg border border-line');
      for (const conv of recent) {
        const details = make('details', 'group');
        const summary = make('summary', 'flex min-h-11 cursor-pointer flex-wrap items-center justify-between gap-2 px-4 py-3 text-sm hover:bg-side');
        const left = make('span', 'flex min-w-0 flex-wrap items-center gap-2 font-medium text-ink');
        left.append(
          make('span', 'chip bg-callout text-ink', channelLabel(conv.channel)),
          make('span', '', `${numberFormat.format(conv.turn_count || 0)} tanya-jawab`),
        );
        if (conv.call_duration_seconds != null) {
          left.append(make('span', 'text-xs text-muted', `durasi ${formatSecondsDuration(conv.call_duration_seconds)}`));
        }
        if (conv.has_unanswered) {
          left.append(make('span', 'chip bg-amber-50 text-amber-900', 'Ada belum terjawab'));
        }
        const right = make('span', 'shrink-0 text-xs text-muted', formatWibDateTime(conv.last_message_at || conv.started_at));
        summary.append(left, right);

        const thread = make('div', 'space-y-3 border-t border-line bg-side px-4 py-4');
        const msgs = Array.isArray(conv.messages) ? conv.messages : [];
        if (msgs.length === 0) {
          thread.append(make('p', 'text-xs text-muted', 'Tidak ada pesan tercatat di sesi ini.'));
        } else {
          for (const msg of msgs) {
            const msgBox = make('div', 'rounded-md border border-line bg-white p-3 text-sm');
            const msgHead = make('div', 'flex flex-wrap items-center justify-between gap-2 text-xs text-muted');
            const who = make('span', 'font-semibold text-ink', msg.role === 'user' ? 'Calon murid' : 'Sigi');
            const flags = make('span', 'flex flex-wrap items-center gap-1.5');
            if (msg.role === 'user' && msg.topic) flags.append(make('span', 'chip bg-callout text-muted', topicLabel(msg.topic)));
            if (msg.is_unanswered) flags.append(make('span', 'chip bg-amber-50 text-amber-900', 'Belum terjawab'));
            if (msg.had_pii_redacted) flags.append(make('span', 'chip bg-mint text-brand-dark', 'PII disensor'));
            flags.append(make('span', '', formatWibDateTime(msg.created_at)));
            msgHead.append(who, flags);
            msgBox.append(msgHead, make('p', 'mt-1.5 whitespace-pre-wrap break-words leading-relaxed text-ink', msg.content));
            thread.append(msgBox);
          }
        }
        details.append(summary, thread);
        stack.append(details);
      }
      recentSection.append(stack);
    }
    nodes.push(recentSection);

    body.replaceChildren(...nodes);
  }

  async function loadAnalytics() {
    const requestId = ++activeRequest;
    showLoading();
    const isServerHost = (location.protocol === 'http:' && ['localhost', '127.0.0.1'].includes(location.hostname))
      || (location.protocol === 'https:' && location.hostname.endsWith('.vercel.app'));
    if (!isServerHost) {
      body.replaceChildren(callout('Mode statis tanpa server belum bisa membaca database Supabase. Jalankan dashboard lewat server lokal (node server.mjs) atau deployment Vercel.', 'bg-callout'));
      return;
    }

    const params = new URLSearchParams({
      school: schoolId,
      days: analyticsFilter.days,
    });
    if (analyticsFilter.period) params.set('period', analyticsFilter.period);

    try {
      const response = await fetch(`/api/analytics?${params}`, { cache: 'no-store' });
      if (requestId !== activeRequest) return;
      const data = await response.json().catch(() => null);

      if (response.status === 401 || data?.error?.code === 'SIGI_LOGIN') {
        body.replaceChildren();
        renderLoginPrompt(body, () => {
          api.refresh?.();
          loadAnalytics();
        });
        return;
      }

      if (!response.ok) {
        const errBox = make('div', 'rounded-lg border border-red-200 bg-red-50 p-5 text-sm text-red-900');
        errBox.append(
          make('p', 'font-semibold', 'Gagal memuat data percakapan'),
          make('p', 'mt-1 break-words', data?.error?.message || `Server mengembalikan kode ${response.status}.`),
          button('Coba lagi', 'btn mt-4', () => loadAnalytics()),
        );
        body.replaceChildren(errBox);
        return;
      }

      if (!data?.configured) {
        const setupBox = make('div', 'rounded-lg border border-line bg-side p-6');
        setupBox.append(
          make('h2', 'text-lg font-bold text-ink', 'Database Supabase belum tersambung'),
          make('p', 'mt-2 max-w-2xl text-sm leading-relaxed text-muted', 'Isi SUPABASE_URL dan SUPABASE_SERVICE_ROLE_KEY di file .env (atau Environment Variables Vercel), lalu jalankan skrip supabase/schema.sql di SQL Editor Supabase.'),
          button('Cek koneksi ulang', 'btn btn-primary mt-4', () => loadAnalytics()),
        );
        body.replaceChildren(setupBox);
        return;
      }

      renderAnalyticsData(data);
    } catch {
      if (requestId !== activeRequest) return;
      const errBox = make('div', 'rounded-lg border border-red-200 bg-red-50 p-5 text-sm text-red-900');
      errBox.append(
        make('p', 'font-semibold', 'Tidak bisa terhubung ke server Sigi'),
        make('p', 'mt-1', 'Pastikan server lokal jalan dengan node server.mjs, lalu coba lagi.'),
        button('Coba lagi', 'btn mt-4', () => loadAnalytics()),
      );
      body.replaceChildren(errBox);
    }
  }

  loadAnalytics();
}

/* Navigasi */

const VIEWS = {
  info: renderInfo,
  halaman: () => renderPage(current.id),
  dokumen: () => renderDocuments(),
  uji: renderTest,
  tampilan: renderLook,
  pasang: renderInstall,
  percakapan: renderConversations,
};

function route() {
  const [viewName, id] = location.hash.replace(/^#\/?/, '').split('/');
  current = { view: VIEWS[viewName] ? viewName : 'info', id: id || null };
  closeSidebar();
  VIEWS[current.view]();
  renderSidebar();
  el.view.scrollTop = 0;
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', route);
el.openSidebar.addEventListener('click', openSidebar);
el.closeSidebar.addEventListener('click', () => closeSidebar({ restoreFocus: true }));
el.backdrop.addEventListener('click', () => closeSidebar({ restoreFocus: true }));
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !el.backdrop.hidden) closeSidebar({ restoreFocus: true });
});
desktop.addEventListener('change', syncSidebarMode);
el.addPage.addEventListener('click', addPage);
el.reset.addEventListener('click', () => {
  if (!window.confirm('Reset semua data demo ke data bawaan? Halaman, PDF, dan tampilan yang sudah diubah akan hilang.')) return;
  api.data.reset();
  school = api.data.load();
  setStatus('Data demo direset');
  route();
});

setStatus(school.updatedAt ? `Tersimpan ${formatUpdated(school.updatedAt).toLowerCase()}` : 'Data bawaan');
syncSidebarMode();
route();
  </script>
</body>
</html>
