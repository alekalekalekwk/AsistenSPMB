  <style type="text/tailwindcss">
    /* Halaman kios Asisten SPMB: maskot kijang di kiri bawah, ucapannya di bubble kanan (sesuai sketsa).
       Tamu cukup menekan "Mulai ngobrol" sekali, lalu bicara. Logika suara memakai widget.js mode kios. */
    @theme {
      --font-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      --color-navy: #001e42;
      --color-navy-700: #002c62;
      --color-royal: #223987;
      --color-gold: #e3ce0f;
      --color-cloud: #f3f6fa;
    }
    @layer base {
      :focus-visible { outline: 2px solid var(--color-gold); outline-offset: 3px; }
    }
    /* Maskot muncul dari bawah sekali. Animasi pose (kedip, melambai, bicara) ada di dalam SVG-nya. */
    @keyframes sigi-naik { from { transform: translateY(24px); opacity: 0; } }
    .sigi-maskot { animation: sigi-naik .6s ease-out both; }
    @media (prefers-reduced-motion: reduce) { .sigi-maskot { animation: none; } }
  </style>
</head>

  <!-- ?v=… memaksa browser mengambil versi terbaru. Naikkan angkanya setiap kali widget.js atau sekolah/wikrama.js diubah. -->
  <script src="sekolah/wikrama.js?v=20261126b"></script>
  <script src="widget.js?v=20261126b" data-mode="kiosk" defer></script>
  <script>
    const maskot = document.getElementById('sigi-maskot');
    const statusEl = document.getElementById('status');
    const kataSigi = document.getElementById('kata-sigi');
    const kataTamu = document.getElementById('kata-tamu');
    const tombolMulai = document.getElementById('mulai');
    const tombolSelesai = document.getElementById('selesai');

    const STATUS = {
      listening: 'Sigi mendengarkan. Silakan ngomong.',
      thinking: 'Sigi lagi nyari jawabannya...',
      speaking: 'Sigi sedang menjawab',
    };
    // Obrolan diakhiri sendiri kalau tidak ada yang bicara selama ini, supaya mikrofon kios tidak terus menyala.
    const SEPI_MS = 60000;

    let ngobrol = false;
    let sepiTimer;
    let maskotTimer;

    function setMaskot(state, ms) {
      clearTimeout(maskotTimer);
      maskot.dataset.state = state;
      if (ms) maskotTimer = setTimeout(() => { maskot.dataset.state = 'idle'; }, ms);
    }

    function setNgobrol(aktif) {
      ngobrol = aktif;
      tombolMulai.hidden = aktif;
      tombolSelesai.hidden = !aktif;
      if (!aktif) clearTimeout(sepiTimer);
    }

    function tungguSepi() {
      clearTimeout(sepiTimer);
      sepiTimer = setTimeout(() => window.SigiWidget?.hangUp(), SEPI_MS);
    }

    setMaskot('greeting', 2800);
    maskot.addEventListener('pointerenter', () => {
      if (maskot.dataset.state === 'idle') setMaskot('greeting', 2200);
    });

    tombolMulai.addEventListener('click', () => {
      const widget = window.SigiWidget;
      if (!widget) {
        kataSigi.textContent = 'Sebentar, Sigi masih bersiap. Coba tekan lagi.';
        return;
      }
      kataTamu.textContent = '';
      statusEl.textContent = 'Menyambung...';
      setNgobrol(true);
      widget.call({ open: false });
      tombolSelesai.focus();
    });

    tombolSelesai.addEventListener('click', () => window.SigiWidget?.hangUp());

    window.addEventListener('sigi:state', (event) => {
      const state = event.detail.state;
      if (!['idle', 'listening', 'thinking', 'speaking'].includes(state)) return;
      // 'speaking' memakai animasi mulut bawaan SVG (sama dengan assets/kijang/states/speaking.svg),
      // aktif persis selama suara Sigi diputar: widget memasang speaking sebelum audio jalan dan menggantinya sesudahnya.
      setMaskot(state);
      if (state === 'idle') {
        if (ngobrol) {
          statusEl.textContent = 'Obrolan selesai. Tekan "Mulai ngobrol" untuk tanya lagi.';
          kataTamu.textContent = '';
        }
        setNgobrol(false);
        tombolMulai.focus();
        return;
      }
      statusEl.textContent = STATUS[state];
      if (state === 'listening') {
        kataTamu.textContent = '';
        tungguSepi();
      } else {
        clearTimeout(sepiTimer);
      }
    });

    window.addEventListener('sigi:say', (event) => {
      kataSigi.textContent = event.detail.text;
      kataSigi.scrollTop = 0;
    });

    window.addEventListener('sigi:heard', (event) => {
      kataTamu.textContent = event.detail.text ? `Kamu: “${event.detail.text}”` : '';
      tungguSepi();
    });

    window.addEventListener('sigi:question', (event) => {
      kataTamu.textContent = `Kamu: “${event.detail.text}”`;
    });

    window.addEventListener('sigi:error', (event) => {
      setNgobrol(false);
      setMaskot('idle');
      statusEl.textContent = 'Ada kendala';
      kataSigi.textContent = event.detail.needsKey
        ? `${event.detail.message} Panel Sigi sudah dibuka di pojok kanan bawah.`
        : event.detail.message;
    });

  </script>
</body>
</html>
